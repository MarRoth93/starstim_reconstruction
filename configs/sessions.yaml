# StarStim sessions used for reconstruction. id = folder prefix in data/lab_sessions (E<nn>_<date>_<code>).
# kind: stim  = memorability_stim sessions (images shown during a stimulation protocol; only pulse-free blocks are used)
#       recon = dedicated reconstruction blocks without stimulation (future recordings)
# rsvp: true marks a session with a rapid-stream block (image codes 3001-3299, 5 images per second, no stimulation),
#       read by data_sessions.load_rsvp and scripts/run_rsvp_reconstruction.py
# Timing: in some sessions the EEG time stamps drift against the marker clock. Both loaders correct that automatically
#       from the stimulation pulses of the session's own recordings (data_sessions.clock_error); nothing is entered here.
# rsvp_offset_ms (optional, per session): only for a rapid-stream session whose offset the pulses cannot give (no
#       stimulation in the recording). True image onset minus image marker as [ms at the start of the run's EEG stream,
#       ms per minute] or one number; it replaces clock error + display lag. scripts/check_rsvp_timing.py says when it
#       is needed and prints the line.
# Add a new recording by putting its folder into the lab_sessions location and adding a line here, then rerun
#   python scripts/make_infographic.py --recompute
# Image onset on our screen after its marker in the rapid stream, relative to THINGS-EEG2 timing (ms). The pulses cannot
# measure it; it is the remainder between the clock error and the image-based offset in E21 and E23
# (scripts/check_rsvp_timing.py). Not yet confirmed with a photodiode.
rsvp_display_lag_ms: 46
sessions:
  - {id: E06, kind: stim}
  - {id: E07, kind: stim}
  - {id: E08, kind: stim}
  - {id: E09, kind: stim}
  - {id: E10, kind: stim}
  - {id: E11, kind: stim}
  - {id: E12, kind: stim}
  - {id: E13, kind: stim}
  - {id: E14, kind: stim}
  - {id: E15, kind: stim}
  - {id: E16, kind: stim}
  - {id: E17, kind: stim}
  - {id: E18, kind: stim}
  - {id: E19, kind: stim}
  - {id: E20, kind: stim}
  - {id: E21, kind: stim, rsvp: true}
  # E23: its slow-image codes are 1401-1544, outside the 1001-1299 the slow-trial loader reads,
  # so only its rapid-stream block is used
  - {id: E23, kind: stim, rsvp: true}
  - {id: E24, kind: stim, rsvp: true}
  - {id: E25, kind: stim, rsvp: true}
  # E26: slow-image codes 1401-1544 as in E23, so only its rapid-stream block is used
  - {id: E26, kind: stim, rsvp: true}
  - {id: E27, kind: stim, rsvp: true}
  # E28, E29: slow-image codes 1401-1544 as in E23, so only their rapid-stream blocks are used
  - {id: E28, kind: stim, rsvp: true}
  - {id: E29, kind: stim, rsvp: true}
